# Nginx untuk frontend Laporan Kerusakan Fasilitas Kampus.
# - File HTML disajikan dari bind mount ./frontend -> /usr/share/nginx/html
# - Request /api/... diteruskan ke service "backend" lewat DNS internal Docker (app-net)
server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Bind mount dari laptop: matikan sendfile agar perubahan file langsung terbaca.
    sendfile off;

    # DNS internal Docker. Nama "backend" di-resolve ulang tiap 10 detik,
    # sehingga Nginx tetap tersambung walaupun kontainer backend dibuat ulang (IP berubah).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    location /api/ {
        set $backend_upstream http://backend:5000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
}
