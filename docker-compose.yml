# Stack aplikasi Laporan Kerusakan Fasilitas Kampus (Studi Kasus No. 8)
#
# Jalankan lokal (dari folder proyek):   docker compose up -d --build
# Hentikan:                              docker compose down      (data tetap aman di volume)
#
# HOST_ROOT dipakai Jenkins agar bind mount menunjuk ke folder workspace yang benar.
# Saat dijalankan manual dari laptop, HOST_ROOT kosong sehingga memakai folder ini (.).
name: facility-report

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: facility-backend:latest
    container_name: facility-backend
    environment:
      DATA_FILE: /var/lib/backend_data/facility_reports.json
    volumes:
      - facility-data:/var/lib/backend_data          # Named Volume: data aduan
    networks:
      - app-net
    ports:
      - "${BACKEND_PORT:-5050}:5000"                 # akses langsung API untuk pengujian
    restart: unless-stopped

  frontend:
    image: nginx:1.27-alpine
    container_name: facility-frontend
    volumes:
      - ${HOST_ROOT:-.}/frontend:/usr/share/nginx/html:ro                 # Bind Mount: UI
      - ${HOST_ROOT:-.}/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-net
    ports:
      - "${FRONTEND_PORT:-8090}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  facility-data:
    name: facility-data

networks:
  app-net:
    name: app-net
    driver: bridge
